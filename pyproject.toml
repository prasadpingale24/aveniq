[project]
name = "aveniq"
version = "0.1.0"
description = "Evidence-first incident investigation"
readme = "README.md"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/aveniq_domain",
    "packages/aveniq_application",
    "packages/aveniq_adapters",
    "packages/aveniq_api",
]

[dependency-groups]
dev = [
    "aveniq-api",
    "pytest>=8.3",
    "httpx>=0.27",
    "openapi-spec-validator>=0.7",
    "pyyaml>=6.0",
    "ruff>=0.6",
]

[tool.uv.sources]
aveniq-api = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "packages/aveniq_domain",
    "packages/aveniq_application",
    "packages/aveniq_adapters",
    "packages/aveniq_api",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
