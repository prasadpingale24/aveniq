[project]
name = "aveniq-application"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aveniq-domain",
    "pydantic>=2.9",
]

[tool.uv.sources]
aveniq-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aveniq_application"]
