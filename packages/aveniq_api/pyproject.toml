[project]
name = "aveniq-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aveniq-adapters",
    "aveniq-application",
    "aveniq-domain",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
]

[tool.uv.sources]
aveniq-adapters = { workspace = true }
aveniq-application = { workspace = true }
aveniq-domain = { workspace = true }

[project.scripts]
aveniq-api = "aveniq_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aveniq_api"]
