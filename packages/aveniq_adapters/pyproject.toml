[project]
name = "aveniq-adapters"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aveniq-application",
    "aveniq-domain",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

[tool.uv.sources]
aveniq-application = { workspace = true }
aveniq-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aveniq_adapters"]
